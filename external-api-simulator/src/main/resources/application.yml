spring:
  application:
    name: mock-delivery-provider

server:
  port: ${SERVER_PORT:8090}

management:
  server:
    address: 127.0.0.1
    port: ${SIMULATOR_METRICS_PORT:19090}
  endpoints:
    web:
      exposure:
        include: health,prometheus,simulator,customerResults
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

simulator:
  customer-results:
    enabled: ${SIMULATOR_CUSTOMER_RESULTS_ENABLED:false}
    secret: ${CUSTOMER_RESULT_SIMULATOR_SECRET:}
    delay-millis: ${SIMULATOR_CUSTOMER_RESULTS_DELAY_MILLIS:5000}
  receipts:
    enabled: ${SIMULATOR_RECEIPTS_ENABLED:false}
    primary-url: ${SIMULATOR_RECEIPTS_PRIMARY_URL:http://127.0.0.1:8094/api/v1/receipts/mock-provider}
    secondary-url: ${SIMULATOR_RECEIPTS_SECONDARY_URL:http://127.0.0.1:8094/api/v1/receipts/tcp-provider}
    primary-secret: ${RECEIPT_PRIMARY_SECRET:}
    secondary-secret: ${RECEIPT_SECONDARY_SECRET:}
  tcp:
    enabled: ${SIMULATOR_TCP_ENABLED:true}
    bind-address: ${SIMULATOR_TCP_BIND_ADDRESS:127.0.0.1}
    port: ${SIMULATOR_TCP_PORT:8093}
  response-delay-millis: ${SIMULATOR_RESPONSE_DELAY_MILLIS:0}
  deduplicate: ${SIMULATOR_DEDUPLICATE:false}
  max-tracked-keys: ${SIMULATOR_MAX_TRACKED_KEYS:200000}
