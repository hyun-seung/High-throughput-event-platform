server:
  port: ${MESSAGE_WEBHOOK_PORT:8099}
  shutdown: graceful

spring:
  application:
    name: messaging-webhook-receive-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: ${MESSAGE_WEBHOOK_ASYNC_TIMEOUT:20s}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false
        "[max.block.ms]": ${KAFKA_PUBLISH_MAX_BLOCK_MS:5000}
        "[request.timeout.ms]": ${KAFKA_PUBLISH_REQUEST_TIMEOUT_MS:5000}
        "[delivery.timeout.ms]": ${KAFKA_PUBLISH_DELIVERY_TIMEOUT_MS:10000}

message:
  webhook:
    skt-secret: ${MESSAGE_WEBHOOK_SKT_SECRET:}
    kt-secret: ${MESSAGE_WEBHOOK_KT_SECRET:}
    lgu-secret: ${MESSAGE_WEBHOOK_LGU_SECRET:}

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  server:
    address: 127.0.0.1
    port: ${MESSAGE_WEBHOOK_METRICS_PORT:19089}
  endpoints:
    web:
      exposure:
        include: health
