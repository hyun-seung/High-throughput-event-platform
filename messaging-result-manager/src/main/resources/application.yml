server:
  port: ${MSG_RESULT_MANAGER_PORT:8102}
  shutdown: graceful

spring:
  application:
    name: messaging-result-manager
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
      concurrency: ${MSG_RESULT_CONCURRENCY:3}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[allow.auto.create.topics]": false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000

delivery:
  dynamodb:
    enabled: true
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    initialize-tables: ${DYNAMODB_INITIALIZE_TABLES:true}

messaging:
  result:
    expiry:
      initial-delay-ms: ${MSG_RESULT_EXPIRY_INITIAL_DELAY_MS:5000}
      poll-ms: ${MSG_RESULT_EXPIRY_POLL_MS:5000}
      page-size: ${MSG_RESULT_EXPIRY_PAGE_SIZE:100}
      backfill:
        enabled: ${MSG_RESULT_EXPIRY_BACKFILL_ENABLED:false}
        initial-delay-ms: ${MSG_RESULT_EXPIRY_BACKFILL_INITIAL_DELAY_MS:5000}
        poll-ms: ${MSG_RESULT_EXPIRY_BACKFILL_POLL_MS:1000}
        page-size: ${MSG_RESULT_EXPIRY_BACKFILL_PAGE_SIZE:100}
    outbox:
      enabled: ${MSG_RESULT_OUTBOX_ENABLED:false}
      initial-delay-ms: ${MSG_RESULT_OUTBOX_INITIAL_DELAY_MS:5000}
      poll-ms: ${MSG_RESULT_OUTBOX_POLL_MS:5000}
      page-size: ${MSG_RESULT_OUTBOX_PAGE_SIZE:100}
    followup:
      initial-delay-ms: ${MSG_RESULT_FOLLOWUP_INITIAL_DELAY_MS:5000}
      poll-ms: ${MSG_RESULT_FOLLOWUP_POLL_MS:5000}
      page-size: ${MSG_RESULT_FOLLOWUP_PAGE_SIZE:100}

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  server:
    address: 127.0.0.1
    port: ${MSG_RESULT_MANAGER_METRICS_PORT:19094}
  endpoints:
    web:
      exposure:
        include: health
