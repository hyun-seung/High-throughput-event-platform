server:
  port: ${MSG_HTTP_SENDER_PORT:8101}
  shutdown: graceful

spring:
  application:
    name: messaging-carrier-http-sender
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_TIMEOUT:200ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
      concurrency: ${MSG_HTTP_SENDER_CONCURRENCY:3}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": messaging.common.messages.HttpSendCommand
        "[spring.json.trusted.packages]": messaging.common.messages
        "[allow.auto.create.topics]": false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000

delivery:
  dynamodb:
    enabled: true
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    initialize-tables: false

messaging:
  carrier:
    sender:
      carrier: ${MSG_HTTP_CARRIER:}
      topic: ${MSG_HTTP_TOPIC:}
      group-id: ${MSG_HTTP_GROUP_ID:}
      base-url: ${MSG_HTTP_BASE_URL:}
      request-path: ${MSG_HTTP_REQUEST_PATH:/api/v1/messages}
      connect-timeout: ${MSG_HTTP_CONNECT_TIMEOUT:2s}
      response-timeout: ${MSG_HTTP_RESPONSE_TIMEOUT:5s}
      claim-ttl: ${MSG_HTTP_CLAIM_TTL:30s}
      recovery-grace: ${MSG_HTTP_RECOVERY_GRACE:30s}
      not-our-carrier-codes: ${MSG_HTTP_NOT_OUR_CARRIER_CODES:}
      tps-exceeded-codes: ${MSG_HTTP_TPS_EXCEEDED_CODES:}

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  server:
    address: 127.0.0.1
    port: ${MSG_HTTP_SENDER_METRICS_PORT:19091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[messaging.carrier.http.duration]": true
