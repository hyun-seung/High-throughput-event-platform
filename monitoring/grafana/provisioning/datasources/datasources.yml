apiVersion: 1
datasources:
  - name: Prometheus
    uid: platform-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST
      manageAlerts: false
  - name: Loki
    uid: platform-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
