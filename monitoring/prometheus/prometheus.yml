global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local-monitoring
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: api
    metrics_path: /metrics/api
    static_configs:
      - targets: ['collector:9800']
        labels: {service: api, zone: local}
  - job_name: ingress
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ingress:19081']
        labels: {service: ingress, zone: local}
  - job_name: dispatch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['dispatch:19082']
        labels: {service: dispatch, zone: local}
  - job_name: simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['simulator:19090']
        labels: {service: simulator, zone: local}
  - job_name: kafka-observer
    static_configs:
      - targets: ['collector:9800']
        labels: {zone: local}
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: {zone: local}
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: {zone: local}
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: {zone: local}
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: {zone: local}
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: {zone: local}
