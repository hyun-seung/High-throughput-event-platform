groups:
  - name: messaging-local
    rules:
      - alert: MessagingServiceDown
        expr: up{job=~"api|pre-send|skt-sender|kt-sender|lgu-sender|webhook-receive|result-manager|complete-manager|webhook-sender|tcp-sender|publication-recovery"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: '메시징 AP 수집 실패: {{ $labels.job }}'
      - alert: MessagingKafkaObservationUnavailable
        expr: platform_kafka_probe_up == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: 메인 경로 Kafka offset 관측 실패}
      - alert: MessagingConsumerLag
        expr: sum(platform_kafka_committed_lag{group=~"messaging-.*"}) > 100
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 메시징 소비 대기 100건 초과}
      - alert: MessagingOldestPending
        expr: max(platform_kafka_oldest_uncommitted_age_seconds{group=~"messaging-.*"}) > 60
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 메시징 Kafka 최장 대기 60초 초과}
      - alert: MessagingApiServerError
        expr: sum(increase(http_server_requests_seconds_count{job="api",uri="/api/v1/messages",status=~"5.."}[5m])) > 0
        labels: {severity: warning}
        annotations: {summary: 신규 메시지 접수 API 5xx 발생}
      - alert: MessagingWebhookExhausted
        expr: sum(increase(messaging_webhook_attempts_total{job="webhook-sender",outcome="exhausted"}[5m])) > 0
        labels: {severity: critical}
        annotations: {summary: 고객 웹훅 발송 재시도 소진}
      - alert: MessagingRedisUnavailable
        expr: redis_up == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: Redis 연결 실패}
      - alert: MessagingPostgresUnavailable
        expr: pg_up == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: PostgreSQL 연결 실패}
      - alert: MessagingLogCollectorDown
        expr: up{job="alloy"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 신규 AP 로그 수집기 연결 실패}
