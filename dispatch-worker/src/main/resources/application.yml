spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_TIMEOUT:200ms}
  application:
    name: dispatch-worker

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
      concurrency: ${DISPATCH_CONCURRENCY:3}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": event.common.delivery.DeliveryEvent
        "[spring.json.trusted.packages]": event.common.delivery

external-api:
  base-url: ${EXTERNAL_API_BASE_URL:http://localhost:8090}
  connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:2s}
  read-timeout: ${EXTERNAL_API_READ_TIMEOUT:5s}
  max-connections: ${EXTERNAL_API_MAX_CONNECTIONS:64}
  max-connections-per-route: ${EXTERNAL_API_MAX_CONNECTIONS_PER_ROUTE:64}
  acquire-timeout: ${EXTERNAL_API_ACQUIRE_TIMEOUT:2s}
  max-idle-time: ${EXTERNAL_API_MAX_IDLE_TIME:30s}

dispatch:
  lifecycle:
    enabled: ${DISPATCH_LIFECYCLE_ENABLED:false}
    poll-ms: ${DISPATCH_LIFECYCLE_POLL_MS:1000}
    recovery-poll-ms: ${DISPATCH_LIFECYCLE_RECOVERY_POLL_MS:600000}
    concurrency: ${DISPATCH_LIFECYCLE_CONCURRENCY:4}
  provider: ${DISPATCH_PROVIDER:mock-provider}
  lease-duration: ${DISPATCH_LEASE_DURATION:30s}
  primary-ttl: ${DISPATCH_PRIMARY_TTL:3h}
  no-response-retry-delay: ${DISPATCH_NO_RESPONSE_RETRY_DELAY:1s}
  secondary:
    provider: ${SECONDARY_PROVIDER:tcp-provider}
    ttl: ${SECONDARY_TTL:4h}
  redelivery-backoff-ms: ${DISPATCH_REDELIVERY_BACKOFF_MS:1000}

external-tcp:
  host: ${EXTERNAL_TCP_HOST:localhost}
  port: ${EXTERNAL_TCP_PORT:8093}
  connect-timeout: ${EXTERNAL_TCP_CONNECT_TIMEOUT:2s}
  exchange-timeout: ${EXTERNAL_TCP_EXCHANGE_TIMEOUT:5s}
  max-connections: ${EXTERNAL_TCP_MAX_CONNECTIONS:32}
  max-pending-acquires: ${EXTERNAL_TCP_MAX_PENDING_ACQUIRES:64}
  acquire-timeout: ${EXTERNAL_TCP_ACQUIRE_TIMEOUT:2s}
  io-threads: ${EXTERNAL_TCP_IO_THREADS:2}

delivery:
  completed-retention: ${DELIVERY_COMPLETED_RETENTION:24h}
  dynamodb:
    enabled: true
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    initialize-tables: false

management:
  server:
    address: 127.0.0.1
    port: ${DISPATCH_METRICS_PORT:19082}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      maximum-expected-value:
        "[delivery.acceptance.latency]": 7h
      percentiles-histogram:
        "[http.server.requests]": true
        "[delivery.stage.duration]": true
        "[delivery.dynamodb.duration]": true
        "[delivery.acceptance.latency]": true

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8092}
