spring:
  application:
    name: delivery-ingress-worker

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
      concurrency: ${INGRESS_CONCURRENCY:3}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": event.common.delivery.DeliveryEvent
        "[spring.json.trusted.packages]": event.common.delivery
    producer:
      acks: all
      properties:
        "[enable.idempotence]": true
        "[compression.type]": zstd
        "[linger.ms]": ${INGRESS_KAFKA_LINGER_MS:5}
        "[spring.json.add.type.headers]": false
        "[max.block.ms]": ${KAFKA_PUBLISH_MAX_BLOCK_MS:5000}
        "[request.timeout.ms]": ${KAFKA_PUBLISH_REQUEST_TIMEOUT_MS:5000}
        "[delivery.timeout.ms]": ${KAFKA_PUBLISH_DELIVERY_TIMEOUT_MS:10000}

delivery:
  ingress:
    failure:
      retry-interval: ${INGRESS_RETRY_INTERVAL:1s}
      max-retries: ${INGRESS_MAX_RETRIES:2}
  dynamodb:
    enabled: true
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    initialize-tables: ${DYNAMODB_INITIALIZE_TABLES:true}

management:
  server:
    address: 127.0.0.1
    port: ${INGRESS_METRICS_PORT:19081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      maximum-expected-value:
        "[delivery.acceptance.latency]": 7h
      percentiles-histogram:
        "[http.server.requests]": true
        "[delivery.stage.duration]": true
        "[delivery.dynamodb.duration]": true
        "[delivery.acceptance.latency]": true

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8091}
