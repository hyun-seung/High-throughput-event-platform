server:
  address: 127.0.0.1
  port: ${RESULT_HTTP_PORT:8095}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_TIMEOUT:200ms}
  application:
    name: delivery-result-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery}
    username: ${DB_USERNAME:delivery}
    password: ${DB_PASSWORD:delivery}
    hikari:
      schema: ${RESULT_DB_SCHEMA:delivery_results}
      maximum-pool-size: 6
      connection-timeout: 3000
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 15
  flyway:
    default-schema: ${RESULT_DB_SCHEMA:delivery_results}
    schemas: ${RESULT_DB_SCHEMA:delivery_results}
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${RESULT_CONSUMER_GROUP:delivery-result-worker-v1}
      auto-offset-reset: earliest
      max-poll-records: 10
      properties:
        "[allow.auto.create.topics]": false
        "[max.poll.interval.ms]": 300000

result:
  topic: ${FINALIZED_TOPIC:delivery.finalized.v1}
  concurrency: ${RESULT_CONCURRENCY:3}
  redelivery-backoff-ms: ${RESULT_REDELIVERY_BACKOFF_MS:1000}

notification:
  enabled: ${CUSTOMER_NOTIFICATIONS_ENABLED:false}
  concurrency: ${CUSTOMER_NOTIFICATION_CONCURRENCY:4}
  poll-ms: ${CUSTOMER_NOTIFICATION_POLL_MS:100}
  http-timeout: ${CUSTOMER_NOTIFICATION_HTTP_TIMEOUT:3s}
  lease: ${CUSTOMER_NOTIFICATION_LEASE:30s}
  retry-delay: ${CUSTOMER_NOTIFICATION_RETRY_DELAY:1s}
  max-retry-delay: ${CUSTOMER_NOTIFICATION_MAX_RETRY_DELAY:60s}
  max-batch-bytes: ${CUSTOMER_NOTIFICATION_MAX_BATCH_BYTES:262144}

cleanup:
  enabled: ${DELIVERY_CLEANUP_ENABLED:false}
  poll-ms: ${DELIVERY_CLEANUP_POLL_MS:1000}
  concurrency: ${DELIVERY_CLEANUP_CONCURRENCY:4}
  batch-size: ${DELIVERY_CLEANUP_BATCH_SIZE:20}

delivery:
  completed-retention: ${DELIVERY_COMPLETED_RETENTION:24h}
  dynamodb:
    enabled: ${DELIVERY_CLEANUP_ENABLED:false}
    endpoint: ${DYNAMODB_ENDPOINT:}
    initialize-tables: false

management:
  server:
    address: 127.0.0.1
    port: ${RESULT_METRICS_PORT:19085}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[delivery.result.store.duration]": true
        "[delivery.notification.http.duration]": true
        "[delivery.cleanup.duration]": true
